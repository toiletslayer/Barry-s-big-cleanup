name: Import canonical damage sheets
on:
  push:
    branches:
      - feature/canonical-damage-sprites-21
    paths:
      - 'assets/sprites/damage/_transport/**'
      - '.github/workflows/import-damage-sheets.yml'
permissions:
  contents: write
jobs:
  import:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Decode and verify the nine remaining PNG sheets
        shell: bash
        run: |
          set -euo pipefail
          cd assets/sprites/damage
          for family in mailbox pavilion shed shrub sign storefront table trash tree; do
            if [ -f "_transport/${family}.b64" ]; then
              base64 --decode "_transport/${family}.b64" > "${family}.png"
            else
              cat "_transport/${family}.b64.part"* | base64 --decode > "${family}.png"
            fi
          done
          echo 'b2b18d6970dccab13320ac023339e0c49af2d99440c7fc335cc28c775d00fff9  mailbox.png' | sha256sum --check --status
          echo '6b47ac01ca67f1981096c813628e8d90a2e1da174ff06dbb450d83850f9ea252  pavilion.png' | sha256sum --check --status
          echo '0e4a28ec911e4d66cfe90d70a72668c1e7b00c33820867ee67106621762b8097  shed.png' | sha256sum --check --status
          echo '2376a1d62df2eca56eb8011ea6cabcb913330671c18bbc1155082556dd5306ea  shrub.png' | sha256sum --check --status
          echo 'a0d87b90188b3611a886a034fe3f0a5ea300fd48830d1481962ecc4e190a4cb0  sign.png' | sha256sum --check --status
          echo 'd30b0363d0e97b7d1ef9810ac706729dfb9151a990f760e98794a6ea8c786881  storefront.png' | sha256sum --check --status
          echo 'c29ab9069bb21afd74947edb94ffcc8179a8c58bf1c78225182d28970d0bdeb9  table.png' | sha256sum --check --status
          echo '048095bde5c109df196f817162c2174666234a6d5f4b36a079fa0e53bacc1844  trash.png' | sha256sum --check --status
          echo '464e99b92277db5c3efc54513b05debe120ef45a6cc66cc7fb4eaed14b10a396  tree.png' | sha256sum --check --status
          cd ../../..
          node tests/damage-sprites.test.cjs
      - name: Commit verified canonical assets
        shell: bash
        run: |
          set -euo pipefail
          rm -rf assets/sprites/damage/_transport
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add assets/sprites/damage
          if ! git diff --cached --quiet; then
            git commit -m "Import and verify all 21 canonical PNG damage sheets"
            git push origin HEAD:feature/canonical-damage-sprites-21
          fi
