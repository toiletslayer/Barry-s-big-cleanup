name: Damage sprite validation
on:
  pull_request:
  push:
    branches: [main, feature/canonical-damage-sprites]
jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
      - run: node tests/damage-sprites.test.js
